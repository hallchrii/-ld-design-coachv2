  /* Header */
  .chat-header { background: #f9f9f9; padding: 14px 20px 12px; border-bottom: 3px solid #2c722c; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .header-title { font-size: 18px; font-weight: 700; color: #333; margin: 0; }
  .header-subtitle { font-size: 12px; color: #666; margin: 4px 0 0; line-height: 1.4; }
  .restart-btn { flex-shrink: 0; padding: 7px 12px; border-radius: 16px; border: 1.5px solid #b7b7b7; background: #fff; color: #555; font-size: 12px; font-weight: 600; cursor: pointer; }
  .restart-btn:hover { border-color: #0a7a8a; color: #0a7a8a; }
  .restart-btn.confirm { background: #b3261e; border-color: #b3261e; color: #fff; }

  .phases { list-style: none; display: flex; gap: 4px; margin: 10px 0 0; padding: 0; }
  .phases li { flex: 1; text-align: center; font-size: 11px; font-weight: 600; padding: 5px 2px; border-radius: 6px; background: #eef2f2; color: #6c7472; transition: all .3s; }
  .phases li.done { background: #cfe6e4; color: #0a5a66; }
  .phases li.active { background: #0a7a8a; color: #fff; }

  /* Messages */
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
  .message-group { display: flex; gap: 12px; animation: slideIn .35s ease-out; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .message-group.user { flex-direction: row-reverse; }
  .character-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .avatar-ld { background-color: #0a5a66; background-size: cover; background-position: center top; border: 2px solid #f9f9f9; }
  .avatar-user { background: linear-gradient(135deg, #2c722c, #1d4f1d); }
  .msg-wrap { min-width: 0; max-width: 560px; }
  .message-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .message-group.user .message-name { text-align: right; }
  .message-bubble { padding: 14px 16px; border-radius: 16px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .message-group.ai .message-bubble { background: #f9f9f9; color: #2f3330; box-shadow: 0 4px 16px rgba(0,0,0,.28); }
  .message-group.user .message-bubble { background: #2c722c; color: #fff; white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .message-bubble ul { margin: 6px 0; padding-left: 20px; }
  .message-bubble p { margin: 0 0 10px; }
  .message-bubble p:last-child { margin-bottom: 0; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #0a7a8a; color: #fff; }
  .badge.addie { background: #2c722c; }
  .badge.kirk { background: #eef2f2; color: #0a5a66; }

  .typing { display: inline-flex; gap: 4px; padding: 16px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: #aaa; animation: blink 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* Controls */
  .options { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }

function el(tag, cls, html) {

let state, busy = false, restartTimer = null, runId = 0;

function freshState() {
  return {

    goal: '', roles: [], objectives: [], scenarios: [], udl: { rep: [], exp: [], eng: [] }, udlNotes: []

function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function usesContext() { return ai.status === 'on' && state.followUps.length > 0; }
function stepNumber(key) {
  const order = ['need', 'cause'].concat(usesContext() ? ['context'] : []).concat(['goal', 'roles', 'objectives', 'scenarios', 'udl']);
  return order.indexOf(key === 'area' ? 'need' : key) + 1;

function setStep(key) {
  state.step = key;
  const phase = STEPS[key].phase;
  const idx = phase === 'Plan' ? PHASE_ORDER.length : PHASE_ORDER.indexOf(phase);
  document.querySelectorAll('#phases li').forEach((li, i) => {
    li.classList.toggle('done', i < idx);
    li.classList.toggle('active', i === idx);
  });
}

function setMode(mode, placeholder) {
  state.mode = mode;
  const off = mode === 'none';
  input.disabled = off;
  sendBtn.disabled = off;
  input.placeholder = placeholder || '';

}

/* Disable every button already in the chat (prevents re-clicking old steps). */
function lockChat() { chat.querySelectorAll('button').forEach(b => { b.disabled = true; }); }

function botMessage(html, stepKey, mood) {
  const g = el('div', 'message-group ai');
  const pick = mood || (stepKey ? MOOD_BY_STEP[stepKey] : FILLER_MOODS[fillerIndex++ % FILLER_MOODS.length]);
  g.appendChild(coachAvatar(pick));
  const wrap = el('div', 'msg-wrap');
  wrap.appendChild(el('div', 'message-name', 'Instructional Design Coach'));
  const bubble = el('div', 'message-bubble', html);
  if (stepKey) {
    const s = STEPS[stepKey];

    if (s.phase !== 'Plan') tags.appendChild(el('span', 'badge', 'Step ' + stepNumber(stepKey) + ': ' + s.label));
    tags.appendChild(el('span', 'badge addie', 'ADDIE: ' + (s.phase === 'Plan' ? 'Develop · Implement · Evaluate' : s.phase)));
    if (s.extra) tags.appendChild(el('span', 'badge kirk', s.extra));
    bubble.appendChild(tags);
  }
  wrap.appendChild(bubble);

  chat.appendChild(g);

}
/* Insert nodes above a bubble's tag row (or at the end when it has none). */
function addToBubble(bubble, ...nodes) {
  const tags = bubble.querySelector('.tags');
  nodes.forEach(n => (tags ? bubble.insertBefore(n, tags) : bubble.appendChild(n)));

}

/* Typing indicator. Returns a function that removes it. */
function thinking() {
  busy = true;
  input.disabled = true; sendBtn.disabled = true;
  const g = el('div', 'message-group ai');
  g.appendChild(coachAvatar('think'));
  const b = el('div', 'message-bubble');
  b.appendChild(el('span', 'typing', '<span></span><span></span><span></span>'));
  g.appendChild(b);
  chat.appendChild(g);
  scrollDown();
  return () => { g.remove(); busy = false; };
}
function later(fn, delay = 550) {
  const done = thinking();
  const id = runId;
  setTimeout(() => { done(); if (id === runId) fn(); }, delay);
}

function loadIntoInput(text) {
  input.value = text;
  input.focus();
  const firstBracket = text.indexOf('[');
  if (firstBracket > -1) input.setSelectionRange(firstBracket, text.indexOf(']', firstBracket) + 1);
  else input.setSelectionRange(text.length, text.length);
}

/* ---------- AI connection ---------- */
const ai = { status: 'checking', failures: 0 };

function setAI(status) {
  ai.status = status;
  aiPill.className = 'ai-pill ' + status;
  if (status === 'on') { aiPill.textContent = '✨ AI on'; aiPill.title = 'Claude tailors questions and examples to your need.'; }
  else if (status === 'off') { aiPill.textContent = 'Offline mode'; aiPill.title = 'Using built-in content. Works without internet.'; }
  else { aiPill.textContent = 'Checking AI…'; aiPill.title = 'Checking for AI support'; }
}

async function checkAI() {
  if (location.protocol === 'file:') { setAI('off'); return; }
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch(AI_ENDPOINT, { method: 'GET', signal: ctrl.signal, headers: { Accept: 'application/json' } });
    const data = res.ok ? await res.json() : null;
    setAI(data && data.ai === true ? 'on' : 'off');
  } catch (e) {
    setAI('off');
  } finally {
    clearTimeout(t);
  }
}

async function callAI(task, payload) {
  if (ai.status !== 'on') return null;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), AI_TIMEOUT_MS);
  try {
    const res = await fetch(AI_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, payload }),
      signal: ctrl.signal
    });
    if ([401, 403, 404, 405, 501, 503].includes(res.status)) { setAI('off'); return null; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const body = await res.json();
    ai.failures = 0;
    return body && body.data ? body.data : null;
  } catch (e) {
    ai.failures += 1;
    if (ai.failures >= 2) setAI('off');
    return null;
  } finally {
    clearTimeout(t);
  }
}

const strList = (arr, max, count) => (Array.isArray(arr) ? arr : []).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, max)).slice(0, count);

function aiPayload(extra) {

    area: state.area,
    cause: state.cause,
    context: state.context.map(c => ({ q: c.q.slice(0, 250), a: c.a.slice(0, 450) }))
  }, extra || {});
}

/* ---------- Area detection (synonyms + typo tolerance) ---------- */
function normalize(text) {
  return text.toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9:\-\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
function stem(w) {
  if (w.length > 5 && w.endsWith('ies')) return w.slice(0, -3) + 'y';
  if (w.length > 5 && w.endsWith('ing')) return w.slice(0, -3);
  if (w.length > 4 && w.endsWith('ed')) return w.slice(0, -2);
  if (w.length > 4 && /(ss|x|ch|sh)es$/.test(w)) return w.slice(0, -2);
  if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1);
  return w;
}
/* Optimal string alignment distance (counts swapped letters as one edit). */
function editDistance(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 99;
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
  }
  return d[a.length][b.length];
}

function detectAreas(text) {
  const tokens = normalize(text).split(' ').filter(Boolean);
  const stems = tokens.map(stem);
  const joined = ' ' + stems.join(' ') + ' ';
  const ranked = Object.entries(AREAS).map(([key, area]) => {
    let score = 0;
    const matched = [];
    const typoTokens = new Set();
    area.keywords.forEach(kw => {
      const kwStems = normalize(kw).split(' ').map(stem);
      if (kwStems.length > 1 || kw.includes('-') || kw.includes(':')) {
        if (joined.includes(' ' + kwStems.join(' ') + ' ')) { score += 2; matched.push(kw); }
        return;
      }
      const k = kwStems[0];
      if (stems.includes(k)) { score += 1; matched.push(kw); return; }
      if (k.length < 5) return;
      const typo = tokens.find((tok, i) => {
        if (tok.length < 5 || FUZZY_SKIP.has(tok) || typoTokens.has(tok)) return false;
        const limit = Math.min(k.length, stems[i].length) >= 8 ? 2 : 1;
        const dist = editDistance(stems[i], k);
        return dist > 0 && dist <= limit;
      });
      if (typo) { typoTokens.add(typo); score += 0.75; matched.push(kw + ' (you typed "' + typo + '")'); }
    });
    return { key, score, matched };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);

  const best = ranked[0] || null;
  const second = ranked[1] || null;
  let confidence = 'none';
  if (best) confidence = best.score >= 1.5 && (!second || best.score - second.score >= 0.75) ? 'high' : 'weak';
  return { ranked, best, confidence };
}

/* ---------- Step 1: Performance need ---------- */
function start() {
  runId += 1;
  if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
  restartBtn.textContent = 'Start over';
  restartBtn.classList.remove('confirm');
  busy = false;
  state = freshState();
  chat.innerHTML = '';
  input.value = '';
  setStep('need');
  botMessage(
    '<p>Welcome! I\'ll help you plan training that changes performance on the job.</p>' +
    '<p>This works for any program: sales, safety, compliance, technology adoption, customer service, healthcare, leadership, onboarding, or something custom.</p>' +
    '<p><strong>Start here:</strong> What do people need to do better? Tell me who it affects and how you measure it today.</p>',
    'need'
  );
  setMode('need', 'Example: Our sales reps skip discovery questions, and our win rate fell to 18% this year.');
}

async function classifyAndRoute(text) {
  const id = runId;
  setMode('none');
  const done = thinking();
  if (ai.status === 'checking') await Promise.race([aiReady, sleep(5000)]);
  const kw = detectAreas(state.need);
  let aiResult = null;
  if (ai.status === 'on') {
    const data = await callAI('classify', { need: state.need.slice(0, 1500) });
    if (data && AREAS[data.area]) {
      aiResult = {
        area: data.area,
        confidence: ['high', 'medium', 'low'].includes(data.confidence) ? data.confidence : 'low',
        reason: typeof data.reason === 'string' ? data.reason.slice(0, 220) : '',
        followUps: strList(data.followUpQuestions, 220, 3)
      };
    }
  } else {
    await sleep(450);
  }
  done();
  if (id !== runId) return;
  if (aiResult) state.followUps = aiResult.followUps;

  const forceList = state.tries >= 2;
  if (aiResult && (aiResult.confidence !== 'low' || forceList)) {
    showAreas(aiResult.area, '✨ ' + esc(aiResult.reason));
  } else if (kw.confidence === 'high' || (forceList && kw.best)) {
    showAreas(kw.best.key, 'I picked this because you mentioned: ' + kw.best.matched.slice(0, 4).map(m => esc(m.replace(/^[a-z0-9]+/, w => (ACRONYMS.test(w) ? w.toUpperCase() : w)))).join(', ') + '.');
  } else if (forceList) {
    showAreas(null);
  } else {
    showFollowUp(kw);
  }
}

function onNeed(text) {
  state.need = text;
  state.tries = 1;
  userMessage(text);
  classifyAndRoute();
}

function onNeedMore(text) {
  state.need += ' ' + text;
  state.tries += 1;
  userMessage(text);
  lockChat();
  classifyAndRoute();
}

function showFollowUp(kw) {
  setStep('area');
  const r = kw.ranked;
  let intro;
  if (r.length >= 2) intro = '<p>This could be <strong>' + esc(AREAS[r[0].key].label) + '</strong> or <strong>' + esc(AREAS[r[1].key].label) + '</strong>.</p>';
  else if (r.length === 1) intro = '<p>I found one clue pointing to <strong>' + esc(AREAS[r[0].key].label) + '</strong>. Let\'s confirm.</p>';
  else intro = '<p>I need one more detail to point you the right way.</p>';
  intro += '<p><strong>What does this problem touch most?</strong> Pick one, or type more detail and press Send.</p>';
  const bubble = botMessage(intro, 'area');
  const list = el('div', 'options');
  FOLLOW_UP.forEach(f => list.appendChild(btn('clickable-option', '<strong>' + esc(f.text) + '</strong>', () => chooseArea(f.key, f.text))));
  addToBubble(bubble, list, btn('secondary-btn', 'See all program areas', () => { lockChat(); showAreas(null); }));
  setMode('needMore', 'Add detail, like who does the work and what goes wrong');
}

function showAreas(best, reasonHtml) {
  setStep('area');
  const intro = best
    ? '<p>This sounds like <strong>' + esc(AREAS[best].label) + '</strong>. Confirm it, or pick the area that fits better.</p>' + (reasonHtml ? '<div class="reason">' + reasonHtml + '</div>' : '')
    : '<p>Which program area fits best? Pick <strong>Something else</strong> if none of these match. Every area follows the same design process.</p>';
  const bubble = botMessage(intro, 'area');
  const order = best ? [best, ...Object.keys(AREAS).filter(k => k !== best)] : Object.keys(AREAS);
  const list = el('div', 'options');
  order.forEach(key => {
    const tag = key === best ? '<span class="match-tag">Best match</span>' : '';
    list.appendChild(btn('clickable-option', '<strong>' + areaLabel(key) + tag + '</strong>', () => chooseArea(key)));
  });
  addToBubble(bubble, list);
  setMode('none', 'Pick a program area above.');
}

function chooseArea(key, echo) {
  lockChat();
  state.area = key;
  userMessage(echo || areaLabel(key));
  later(showCause);
}

/* ---------- Step 2: Root cause ---------- */
function showCause() {
  setStep('cause');
  const bubble = botMessage(
    '<p>Before we design anything, let\'s check the <strong>root cause</strong>. Training closes skill gaps. Other gaps need other fixes.</p>' +
    '<p>Answer four quick questions about the people who need to improve.</p>',
    'cause'
  );
  const rows = CAUSE_QS.map(q => {
    const row = el('div', 'cause-row');
    row.appendChild(el('div', 'cause-q', esc(q.text) + '<span class="why">' + esc(q.why) + '</span>'));
    const choices = el('div', 'choice-row');
    choices.setAttribute('role', 'group');
    choices.setAttribute('aria-label', q.text);
    Object.entries(ANSWER_LABELS).forEach(([value, label]) => {
      const c = btn('chip', label, b => {
        choices.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        state.cause[q.key] = value;
        document.getElementById('causeError').textContent = '';
      });
      c.setAttribute('aria-pressed', 'false');
      choices.appendChild(c);
    });
    row.appendChild(choices);
    return row;
  });
  const err = el('div', 'form-error'); err.id = 'causeError'; err.setAttribute('role', 'alert');
  addToBubble(bubble, ...rows, err, btn('continue-btn', 'See what this means →', finishCause));
  setMode('none', 'Answer each question above.');
}

function finishCause() {
  const missing = CAUSE_QS.filter(q => !state.cause[q.key]).map(q => q.label);
  if (missing.length) {
    document.getElementById('causeError').textContent = 'Answer every question to continue. Missing: ' + missing.join(', ') + '.';
    return;
  }
  lockChat();
  userMessage(CAUSE_QS.map(q => q.label + ': ' + ANSWER_LABELS[state.cause[q.key]]).join(' · '));
  later(showDiagnosis);
}

function diagnose() {
  const c = state.cause;
  const barriers = [];
  if (c.resources === 'no') barriers.push('Tools, time, or information: give them job aids, better tools, or workload relief.');
  if (c.consequences === 'no') barriers.push('Consequences: recognize the right behavior and remove rewards for shortcuts.');
  if (c.clarity === 'no') barriers.push('Expectations: set a clear standard and give feedback often.');
  const unsure = CAUSE_QS.filter(q => c[q.key] === 'unsure').map(q => q.label);
  let headline;
  if (c.skill !== 'yes' && !barriers.length) headline = '✅ Training is a strong fit. This looks like a skill or knowledge gap.';
  else if (c.skill !== 'yes') headline = '✅ Training fits here. Pair it with fixes for these barriers:';
  else if (barriers.length) headline = '⚠️ They can already do this, so training alone won\'t close the gap. Fix these first:';
  else headline = '⚠️ They can already do this. Look for other causes before you build training, like competing priorities, rare practice, or missing reminders.';
  return { headline, barriers, unsure, fit: c.skill !== 'yes' };
}

function showDiagnosis() {
  const d = diagnose();
  let html = '<p><strong>' + esc(d.headline) + '</strong></p>';
  if (d.barriers.length) html += '<ul class="diag">' + d.barriers.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>';
  if (d.unsure.length) html += '<p>Check these with managers and a few frontline staff: <strong>' + esc(d.unsure.join(', ')) + '</strong>.</p>';
  html += '<p>I\'ll add these to your plan. ' + (d.fit ? 'Next, let\'s shape the training.' : 'You can still design training to support the fixes.') + '</p>';
  const bubble = botMessage(html);
  addToBubble(bubble, btn('continue-btn', 'Continue →', afterCause));
}

function afterCause() {
  lockChat();
  userMessage('Continue');
  if (usesContext()) later(() => askContext(0), 450);
  else runTailor();
}

/* ---------- Step 3: Context (AI questions) ---------- */
function askContext(i) {
  setStep('context');
  const n = state.followUps.length;
  let html = '';
  if (i === 0) html += '<p>A few questions about your situation. Your answers shape the goals, roles, and scenarios I suggest.</p>';
  html += '<p><strong>Question ' + (i + 1) + ' of ' + n + ':</strong> ' + esc(state.followUps[i]) + '</p>';
  const bubble = botMessage(html, i === 0 ? 'context' : null);
  const row = el('div', 'skip-row');
  row.appendChild(btn('secondary-btn', 'Skip this question', () => { lockChat(); userMessage('Skip'); nextContext(i + 1); }));
  if (i < n - 1) row.appendChild(btn('secondary-btn', 'Skip the rest', () => { lockChat(); userMessage('Skip the rest'); runTailor(); }));
  addToBubble(bubble, row);
  state.contextIndex = i;
  setMode('context', 'Type your answer, then press Send.');
}

function onContext(text) {
  lockChat();
  userMessage(text);
  state.context.push({ q: state.followUps[state.contextIndex], a: text });
  nextContext(state.contextIndex + 1);
}

function nextContext(i) {
  if (i < state.followUps.length) later(() => askContext(i), 400);
  else runTailor();
}

async function runTailor() {
  const id = runId;
  setMode('none');
  if (ai.status === 'on') {
    const done = thinking();
    const data = await callAI('tailor', aiPayload());
    done();
    if (id !== runId) return;
    if (data) {
      const t = { goals: strList(data.goals, 240, 4), roles: strList(data.roles, 60, 6), objectives: strList(data.objectives, 240, 3) };
      state.tailored = t.goals.length && t.roles.length && t.objectives.length ? t : null;
    }
    showGoal();
  } else {
    later(showGoal);
  }
}

const getGoals = () => (state.tailored ? state.tailored.goals : AREAS[state.area].goals);
const getRoles = () => (state.tailored ? state.tailored.roles : AREAS[state.area].roles);
const getObjectives = () => (state.tailored ? state.tailored.objectives : AREAS[state.area].objectives);
const aiTag = () => (state.tailored ? '<span class="ai-tag">✨ Tailored</span>' : '');

/* ---------- Step 4: SMART goal ---------- */
function checkSmart(text) {
  const issues = [];
  if (/\[[^\]]*\]/.test(text)) issues.push('Replace the [bracketed] placeholders with your real details.');
  if (text.trim().split(/\s+/).length < 6) issues.push('<strong>Specific:</strong> name the behavior or metric that should change.');
  if (!/\d/.test(text)) issues.push('<strong>Measurable:</strong> add a number, like a %, count, score, or time.');
  if (!TIME_WORDS.test(text)) issues.push('<strong>Time-bound:</strong> add a deadline, like "within 90 days" or "by end of Q2."');
  return issues;
}

function showGoal() {
  setStep('goal');
  const needIsSmart = checkSmart(state.need).length === 0;
  let html = '<p>Now turn that need into a <strong>SMART goal</strong>. This is the business result you will track after training.</p>';
  if (state.tailored) html += '<p>✨ I tailored these examples to what you told me.</p>';
  html += needIsSmart
    ? '<p>Your description already reads like a SMART goal. Use it as written, or start from an example.</p>'
    : '<p>Click an example to load it into the text box. Swap in your real numbers and deadline, then press Send. You can also write your own.</p>';
  const bubble = botMessage(html, 'goal');

  const list = el('div', 'options');
  if (needIsSmart) {
    list.appendChild(btn('clickable-option', '<strong>✓ Use my goal as written</strong><div class="desc">' + esc(state.need) + '</div>', () => acceptGoal(state.need, true)));
  }
  getGoals().forEach(g => {
    list.appendChild(btn('clickable-option', '<strong>' + esc(g) + '</strong><div class="desc">Click to edit this goal' + aiTag() + '</div>', () => loadIntoInput(g)));
  });
  const box = el('div', 'info-box',
    '<strong>SMART check</strong><ul>' +
    '<li><strong>Specific:</strong> names the behavior or metric</li>' +
    '<li><strong>Measurable:</strong> includes a number</li>' +
    '<li><strong>Achievable:</strong> realistic from your baseline</li>' +
    '<li><strong>Relevant:</strong> tied to the business need</li>' +
    '<li><strong>Time-bound:</strong> has a deadline</li></ul>');
  addToBubble(bubble, list, box);
  setMode('goal', 'Write or edit your SMART goal, then press Send.');
}

function onGoal(text) {
  const issues = checkSmart(text);
  userMessage(text);
  if (!issues.length) { acceptGoal(text); return; }
  setMode('none');
  later(() => {
    const bubble = botMessage('<p>Almost there. Tighten this goal so you can measure it later:</p><ul>' + issues.map(i => '<li>' + i + '</li>').join('') + '</ul><p>I put your goal back in the text box to edit.</p>');
    bubble.appendChild(btn('secondary-btn', 'Keep it as written', () => acceptGoal(text, true)));
    setMode('goal', 'Edit your goal, then press Send.');
    input.value = text;
    scrollDown();
  });
}

function acceptGoal(text, echo) {
  lockChat();
  state.goal = text.trim();
  input.value = '';
  if (echo) userMessage('Goal: ' + state.goal);
  setMode('none');
  later(showRoles);
}

/* ---------- Step 5: Roles ---------- */
function showRoles() {
  setStep('roles');
  const bubble = botMessage(
    '<p>SMART goal set: <strong>' + esc(state.goal) + '</strong></p>' +
    '<p>Who needs this training? Pick every role that applies. Each role gets its own practice scenarios.' + aiTag() + '</p>' +
    '<p>Missing a role? Type it in the box and press Send.</p>',
    'roles'
  );
  const grid = el('div', 'role-grid');
  grid.id = 'roleGrid';
  getRoles().forEach(r => grid.appendChild(roleChip(r, false)));
  const note = el('div', 'form-note'); note.id = 'roleNote';
  const err = el('div', 'form-error'); err.id = 'roleError'; err.setAttribute('role', 'alert');
  addToBubble(bubble, grid, note, err, btn('continue-btn', 'Continue with selected roles →', continueRoles));
  setMode('role', 'Add a role, like Regional Trainer');
}

function roleChip(role, selected) {
  const c = btn('chip', esc(role), b => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', on);
    if (on) state.roles.push(role);
    else state.roles = state.roles.filter(r => r !== role);
    const err = document.getElementById('roleError'); if (err) err.textContent = '';
  });
  c.setAttribute('aria-pressed', selected);
  if (selected) state.roles.push(role);
  return c;
}

function onRole(text) {
  const grid = document.getElementById('roleGrid');
  const note = document.getElementById('roleNote');
  const role = text.replace(/\s+/g, ' ').trim().slice(0, 60);
  const existing = [...grid.querySelectorAll('.chip')].find(c => c.textContent.toLowerCase() === role.toLowerCase());
  if (existing) {
    if (existing.getAttribute('aria-pressed') !== 'true') existing.click();
    note.textContent = '"' + existing.textContent + '" is selected.';
  } else {
    grid.appendChild(roleChip(role, true));
    note.textContent = 'Added and selected: ' + role;
  }
  document.getElementById('roleError').textContent = '';
  scrollDown();
}

function continueRoles() {
  if (!state.roles.length) {
    document.getElementById('roleError').textContent = 'Pick at least one role to continue.';
    return;
  }
  lockChat();
  userMessage('Roles: ' + state.roles.join(', '));
  setMode('none');
  later(showObjectives);
}

/* ---------- Step 6: Objectives ---------- */
function showObjectives() {
  setStep('objectives');
  const bubble = botMessage(
    '<p>What should people <strong>do</strong> on the job after training? These are the behaviors you will observe later.</p>' +
    '<p>Use this pattern: <em>Each [role] will [action verb] [task] [to what standard].</em> Send one objective at a time.</p>',
    'objectives'
  );
  const list = el('div', 'options');
  getObjectives().forEach((phrase, i) => {
    const role = state.roles[i % state.roles.length];
    const text = 'Each ' + role + ' will ' + phrase;
    list.appendChild(btn('clickable-option', '<strong>' + esc(text) + '</strong><div class="desc">Click to edit this objective' + aiTag() + '</div>', () => loadIntoInput(text)));
  });
  const box = el('div', 'info-box',
    '<strong>Pick verbs you can observe</strong><ul>' +
    '<li><strong>Use:</strong> identify, demonstrate, apply, prioritize, resolve, document, escalate, coach</li>' +
    '<li><strong>Swap out:</strong> understand, know, learn, be aware of</li></ul>');
  addToBubble(bubble, list, box, btn('continue-btn', 'Done adding objectives →', finishObjectives));
  setMode('objective', 'Each [role] will [action verb] [task] [standard]');
}

function onObjective(text) {
  if (/^done$/i.test(text.trim())) { finishObjectives(); return; }
  userMessage(text);
  const issues = [];
  if (/\[[^\]]*\]/.test(text)) issues.push('Replace the [bracketed] placeholders with your real details.');
  const vague = text.match(VAGUE_VERBS);
  if (vague) issues.push('"' + esc(vague[0]) + '" is hard to observe on the job. Try identify, demonstrate, or apply.');
  if (text.trim().split(/\s+/).length < 4) issues.push('Add more detail: the task and the standard.');

  setMode('none');
  later(() => {
    if (issues.length) {
      const bubble = botMessage('<p>Let\'s sharpen this objective:</p><ul>' + issues.map(i => '<li>' + i + '</li>').join('') + '</ul><p>I put it back in the text box to edit.</p>');
      bubble.appendChild(btn('secondary-btn', 'Keep it as written', b => { b.disabled = true; addObjective(text); }));
      setMode('objective', 'Edit your objective, then press Send.');
      input.value = text;
      scrollDown();
    } else {
      addObjective(text, true);
    }
  }, issues.length ? 550 : 350);
}

function addObjective(text, alreadyInLater) {
  state.objectives.push(text.trim());
  input.value = '';
  const show = () => {
    const bubble = botMessage('<p>Added objective ' + state.objectives.length + '. Send another, or move on to scenarios.</p>');
    bubble.appendChild(btn('continue-btn', 'Done adding objectives →', finishObjectives));
    setMode('objective', 'Add another objective, or click Done.');
    scrollDown();
  };
  if (alreadyInLater) show(); else { setMode('none'); later(show, 350); }
}

function finishObjectives() {
  if (!state.objectives.length) {
    botMessage('<p>Add at least one objective first. Click an example above to start from it.</p>');
    setMode('objective', 'Each [role] will [action verb] [task] [standard]');
    return;
  }
  lockChat();
  userMessage('Done adding objectives');
  loadScenarios();
}

/* ---------- Step 7: Scenarios ---------- */
async function loadScenarios() {
  const id = runId;
  setMode('none');
  if (ai.status === 'on') {
    const done = thinking();
    const data = await callAI('scenarios', aiPayload({ goal: state.goal, roles: state.roles, objectives: state.objectives }));
    done();
    if (id !== runId) return;
    state.aiScenarios = null;
    if (data && data.scenarios && typeof data.scenarios === 'object') {
      const map = {};
      state.roles.forEach(role => {
        const items = strList(data.scenarios[role], 320, 3);
        if (items.length) map[role] = items;
      });
      if (Object.keys(map).length) state.aiScenarios = map;
    }
    showScenarios();
  } else {
    later(showScenarios);
  }
}

function scenariosFor(role) {
  if (state.aiScenarios && state.aiScenarios[role]) return { items: state.aiScenarios[role], ai: true };
  const area = AREAS[state.area];
  if (area.scenarios[role]) return { items: area.scenarios[role], ai: false };
  const asA = 'As ' + (/^([aeiou]|hr\b|fbi|mri|rn\b|lpn|sme\b)/i.test(role) ? 'an ' : 'a ') + role;
  if (/lead|manager|supervisor|director|head|chief|coordinator|owner/i.test(role)) {
    return { ai: false, items: [
      asA + ', a team member says the old way worked fine and ignores the new process. How do you respond?',
      asA + ', results are flat 30 days after training. What do you check first?'
    ] };
  }
  return { ai: false, items: [
    asA + ', it\'s a busy day and a shortcut would skip a step that supports this goal. What do you do?',
    asA + ', you face a situation the training didn\'t cover. Where do you turn, and what do you do first?'
  ] };
}

function showScenarios() {
  setStep('scenarios');
  const bubble = botMessage(
    '<p>Now build <strong>real-world scenarios</strong> for practice. Learners prove what they learned by making choices in these situations.</p>' +
    '<p>Click any example to add it, or type your own. Strong scenarios describe a real situation and end with a choice.</p>',
    'scenarios'
  );
  state.roles.forEach(role => {
    const set = scenariosFor(role);
    const head = el('div', 'role-heading', esc(role) + (set.ai ? ' <span class="ai-tag">✨ Tailored</span>' : ''));
    const list = el('div', 'options');
    set.items.forEach(s => {
      list.appendChild(btn('clickable-option', '<strong>+ ' + esc(s) + '</strong>', b => {
        b.disabled = true;
        b.classList.add('added');
        b.querySelector('strong').textContent = '✓ ' + s;
        state.scenarios.push({ text: s, role });
        updateScenarioCount();
      }));
    });
    addToBubble(bubble, head, list);
  });
  const box = el('div', 'info-box',
    '<strong>🎯 Adult learning principles</strong><ul>' +
    '<li><strong>Problem-centered:</strong> real situations they face</li>' +
    '<li><strong>Experience-based:</strong> they draw on what they already know</li>' +
    '<li><strong>Self-directed:</strong> they choose how to respond</li>' +
    '<li><strong>Immediately relevant:</strong> they can use it on the job today</li></ul>');
  const count = el('div', 'form-note'); count.id = 'scenarioCount';
  addToBubble(bubble, box, count, btn('continue-btn', 'Done adding scenarios →', finishScenarios));
  setMode('scenario', 'Describe a real situation and end with a question, like "What do you do?"');
}

function updateScenarioCount() {
  const n = document.getElementById('scenarioCount');
  if (n) n.textContent = plural(state.scenarios.length, 'scenario') + ' added.';
}

function onScenario(text) {
  if (/^done$/i.test(text.trim())) { finishScenarios(); return; }
  userMessage(text);
  state.scenarios.push({ text: text.trim(), role: null });
  setMode('none');
  later(() => {
    let html = '<p>Added. You now have ' + plural(state.scenarios.length, 'scenario') + '.</p>';
    if (!/\?/.test(text)) html += '<p><em>Tip: end with a question that forces a choice, like "What do you do first?"</em></p>';
    const bubble = botMessage(html);
    bubble.appendChild(btn('continue-btn', 'Done adding scenarios →', finishScenarios));
    setMode('scenario', 'Add another scenario, or click Done.');
    scrollDown();
  }, 350);
}

function finishScenarios() {
  if (!state.scenarios.length) {
    botMessage('<p>Add at least one scenario first. Click an example above or type your own.</p>');
    return;
  }
  lockChat();
  userMessage('Done adding scenarios (' + state.scenarios.length + ')');
  setMode('none');
  later(showUDL);
}

/* ---------- Step 8: UDL ---------- */
function showUDL() {
  setStep('udl');
  const bubble = botMessage(
    '<p>Last design step: apply <strong>Universal Design for Learning</strong> so every learner can access and use this training.</p>' +
    '<p>Pick at least one option in each group. You can type notes about languages, access needs, or tools.</p>',
    'udl'
  );
  Object.entries(UDL).forEach(([key, g]) => {
    const wrap = el('div', 'udl-group');
    wrap.appendChild(el('h4', '', esc(g.title)));
    wrap.appendChild(el('div', 'hint', esc(g.hint)));
    const grid = el('div', 'role-grid');
    g.options.forEach(opt => {
      const c = btn('chip', esc(opt), b => {
        const on = b.getAttribute('aria-pressed') !== 'true';
        b.setAttribute('aria-pressed', on);
        if (on) state.udl[key].push(opt);
        else state.udl[key] = state.udl[key].filter(o => o !== opt);
        document.getElementById('udlError').textContent = '';
      });
      c.setAttribute('aria-pressed', 'false');
      grid.appendChild(c);
    });
    wrap.appendChild(grid);
    addToBubble(bubble, wrap);
  });
  const err = el('div', 'form-error'); err.id = 'udlError'; err.setAttribute('role', 'alert');
  const note = el('div', 'form-note'); note.id = 'udlNote';
  addToBubble(bubble, err, note, btn('continue-btn', 'Build my training plan →', finishUDL));
  setMode('udl', 'Optional: add notes, like "Spanish version needed" or "Night shift has no laptops"');
}

function onUdlNote(text) {
  state.udlNotes.push(text.trim());
  document.getElementById('udlNote').textContent = 'Note saved (' + state.udlNotes.length + '): ' + text.trim();
  scrollDown();
}

function finishUDL() {
  const missing = Object.entries(UDL).filter(([k]) => !state.udl[k].length).map(([, g]) => g.title);
  if (missing.length) {
    document.getElementById('udlError').textContent = 'Pick at least one option for: ' + missing.join(', ') + '.';
    return;
  }
  lockChat();
  userMessage('Build my training plan');
  setMode('none');
  later(showPlan, 800);
}

/* ---------- Plan: Develop, Implement, Evaluate ---------- */
function buildPlan() {
  const s = state, n = s.scenarios.length, d = diagnose();
  const hasQuiz = s.udl.exp.includes('Knowledge check quiz');
  const practice = s.udl.exp.filter(x => x !== 'Knowledge check quiz' && x !== 'Written reflection');
  const analyze = [
    ['Program area', AREAS[s.area].label],
    ['Performance need', s.need],
    ['Root cause check', CAUSE_QS.map(q => q.label + ': ' + ANSWER_LABELS[s.cause[q.key]]).join(' · ')],
    ['Diagnosis', d.headline.replace(/^[✅⚠️\s]+/u, '').replace(/:$/, '.')]
  ];
  s.context.forEach(c => analyze.push(['Context: ' + c.q, c.a]));
  analyze.push(['SMART goal', s.goal], ['Roles', s.roles.join(', ')]);

  const implement = [
    'Pilot with a small group from each role. Revise based on their feedback.',
    'Brief managers before launch so they coach and reinforce the objectives on the job.',
    'Launch with these access supports: ' + s.udl.eng.join(', ') + '.',
    'Schedule follow-up practice or a refresher at 30 days.'
  ];
  d.barriers.forEach(b => implement.push('Non-training fix. ' + b));
  if (d.unsure.length) implement.push('Before launch, confirm these root-cause answers with managers and frontline staff: ' + d.unsure.join(', ') + '.');

  return {
    analyze,
    design: {
      objectives: s.objectives,
      scenarios: s.scenarios.map(x => (x.role && !x.text.includes(x.role) ? '[' + x.role + '] ' : '') + x.text),
      udl: [
        ['Representation', s.udl.rep.join(', ')],
        ['Action & Expression', s.udl.exp.join(', ')],
        ['Engagement', s.udl.eng.join(', ')]
      ].concat(s.udlNotes.length ? [['Notes', s.udlNotes.join('; ')]] : [])
    },
    develop: [
      'Storyboard ' + plural(n, 'scenario') + ' with a choice, a consequence, and feedback for each option.',
      'Build these content assets: ' + s.udl.rep.join(', ') + '.',
      practice.length
        ? 'Create practice for each objective using: ' + practice.join(', ') + '. Write a scoring rubric tied to each objective.'
        : 'Create practice activities for each objective, with a scoring rubric tied to each one.',
      'Review drafts with a subject matter expert from each role: ' + s.roles.join(', ') + '.'
    ],
    implement,
    evaluate: [
      ['Level 1: Reaction', 'Survey learners right after training on relevance, confidence, and ease of access.'],
      ['Level 2: Learning', 'Score learner choices in the ' + plural(n, 'scenario') + (hasQuiz ? ' and the knowledge check' : '') + ' against each objective.'],
      ['Level 3: Behavior', 'Observe or audit these behaviors at 30, 60, and 90 days: ' + s.objectives.join('; ')],
      ['Level 4: Results', 'Track the goal against your pre-launch baseline: ' + s.goal]
    ]
  };
}

function planToText(p) {
  const lines = [];
  const line = (t = '') => lines.push(t);
  line('TRAINING PLAN: ' + AREAS[state.area].label.toUpperCase());
  line('Built with the Instructional Design Coach' + (ai.status === 'on' ? ' (AI-assisted)' : ''));
  line();
  line('ANALYZE');
  p.analyze.forEach(([k, v]) => line('- ' + k + ': ' + v));
  line();
  line('DESIGN');
  line('Learning objectives (Kirkpatrick L3):');
  p.design.objectives.forEach((o, i) => line('  ' + (i + 1) + '. ' + o));
  line('Real-world scenarios (Kirkpatrick L2):');
  p.design.scenarios.forEach((o, i) => line('  ' + (i + 1) + '. ' + o));
  line('UDL design (Kirkpatrick L1):');
  p.design.udl.forEach(([k, v]) => line('  - ' + k + ': ' + v));
  line();
  line('DEVELOP');
  p.develop.forEach(t => line('- ' + t));
  line();
  line('IMPLEMENT');
  p.implement.forEach(t => line('- ' + t));
  line();
  line('EVALUATE (Kirkpatrick)');
  p.evaluate.forEach(([k, v]) => line('- ' + k + ': ' + v));
  return lines.join('\n');
}

const WHEN_RE = /\b(within\s+\d+\s*(?:days?|weeks?|months?|quarters?|years?)|by\s+(?:the\s+)?end\s+of\s+[^,.;<]{2,24}|by\s+Q[1-4](?:\s*20\d\d)?|by\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s*\d{0,4}|Q[1-4]\s*20\d\d|Q[1-4]\b|\d+\s*(?:days?|weeks?|months?|quarters?|years?)|next\s+(?:month|quarter|year)|annually|20\d\d)\b/gi;
const NUM_RE = /(\$\s?\d[\d,]*(?:\.\d+)?|\d[\d,]*(?:\.\d+)?\s?%|\b\d[\d,]*(?:\.\d+)?\b)/g;

/* Colour-code measurements: green for numbers and targets, teal for timeframes. */
function markMeasures(raw) {
  const safe = esc(raw);
  const withTime = safe.replace(WHEN_RE, m => '<span class="when">' + m + '</span>');
  return withTime.split(/(<span class="when">.*?<\/span>)/g)
    .map(part => (part.startsWith('<span') ? part : part.replace(NUM_RE, m => '<span class="num">' + m + '</span>')))
    .join('');
}

function downloadFile(content, filename, type, b) {
  try {
    const url = URL.createObjectURL(new Blob([content], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if (b) flash(b, '✓ Downloaded');
    return true;
  } catch (e) {
    if (b) flash(b, 'Download blocked here.');
    return false;
  }
}

function openSummary(p, b) {
  const html = buildSummaryHtml(p);
  try {
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const w = window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    if (w) { flash(b, '✓ Opened'); return; }
  } catch (e) { /* fall through to download */ }
  downloadFile(html, 'training-plan-summary.html', 'text/html', b);
}

function flash(b, msg) {
  const old = b.textContent;
  b.textContent = msg;
  setTimeout(() => { b.textContent = old; }, 1800);
}

function copyText(text, b) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    flash(b, ok ? '✓ Copied' : 'Copy blocked here. Use Download.');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => flash(b, '✓ Copied'), fallback);
  } else fallback();
}

function downloadText(text, b) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'training-plan-' + state.area + '.txt';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    flash(b, '✓ Downloaded');
  } catch (e) {
    flash(b, 'Download blocked here. Use Copy.');
  }
}

/* ---------- Input routing ---------- */
function handleSend() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  input.value = '';
  switch (state.mode) {
    case 'need': onNeed(text); break;
    case 'needMore': onNeedMore(text); break;
    case 'context': onContext(text); break;
    case 'goal': onGoal(text); break;
    case 'role': onRole(text); break;
    case 'objective': onObjective(text); break;
    case 'scenario': onScenario(text); break;
    case 'udl': onUdlNote(text); break;
    default: input.value = text;
  }
}

  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
restartBtn.addEventListener('click', () => {
  if (restartBtn.classList.contains('confirm')) { start(); return; }
  restartBtn.classList.add('confirm');
  restartBtn.textContent = 'Click again to restart';
  restartTimer = setTimeout(() => {
    restartBtn.classList.remove('confirm');
    restartBtn.textContent = 'Start over';
  }, 3000);
});

const aiReady = checkAI();
start();
